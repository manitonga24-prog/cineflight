// build.gradle (module: app) - CineFlight Solo (drone + YOLO embarque)
// Le bloc plugins doit rester le premier bloc executable du script Gradle.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'jacoco'   // couverture de code (preuve pour le dossier de securite)
}

jacoco {
    toolVersion = "0.8.12"
}

def localProperties = new java.util.Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def rtkV4ConsumerToken = localProperties.getProperty("CINEFLIGHT_RTK_V4_CONSUMER_TOKEN", "")
def rtkV4WsUrl = localProperties.getProperty(
    "CINEFLIGHT_RTK_V4_WS_URL",
    "wss://cineflight.ca/api/v4/rtk/ws/consumer"
)
def rtkV4DeviceId = localProperties.getProperty(
    "CINEFLIGHT_RTK_V4_DEVICE_ID",
    "cineflight-subject-01"
)

def escapeBuildConfig = { String value ->
    value.replace("\\", "\\\\").replace('"', '\\"')
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace 'ca.cineflight.stage'
    compileSdk 34
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "ca.cineflight.solo"
        minSdk 24
        targetSdk 33
        versionCode 42
        versionName "4.2.0"
        buildConfigField "String", "CINEFLIGHT_RTK_V4_CONSUMER_TOKEN", "\"${escapeBuildConfig(rtkV4ConsumerToken)}\""
        buildConfigField "String", "CINEFLIGHT_RTK_V4_WS_URL", "\"${escapeBuildConfig(rtkV4WsUrl)}\""
        buildConfigField "String", "CINEFLIGHT_RTK_V4_DEVICE_ID", "\"${escapeBuildConfig(rtkV4DeviceId)}\""
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    externalNativeBuild {
        cmake {
            version "3.22.1"
            path file('src/main/jni/CMakeLists.txt')
        }
    }
    buildTypes {
        debug {
            // Active la collecte de couverture JaCoCo lors des tests unitaires debug.
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric : charge les ressources Android (R.string) dans les tests JVM qui
        // construisent PiloteDrone (ctx.getString). Requis par ApplicationProvider.
        unitTests.includeAndroidResources = true
        // Transmet les interrupteurs de la ligne de commande (-Dsoak=1,
        // -Dendurance=1, -Dsoak.minutes=N) au JVM des tests. Sans ceci,
        // System.getProperty(...) est toujours null cote test et les tests
        // d'endurance se sautent en silence (SKIPPED).
        unitTests.all { test ->
            test.systemProperty 'soak', System.getProperty('soak', '')
            test.systemProperty 'soak.minutes', System.getProperty('soak.minutes', '')
            test.systemProperty 'endurance', System.getProperty('endurance', '')
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['lib/*/libstlport_shared.so',
                           'lib/*/libDJIFlySafeCore.so',
                           'lib/*/libdjifs_jni.so',
                           'lib/*/libsfjni.so',
                           'lib/*/libc++_shared.so',
                           'lib/*/libomp.so']
        }
        resources {
            excludes += ['META-INF/rxjava.properties', 'assets/location_map_gloffline_*']
        }
    }
}
dependencies {

    testImplementation 'junit:junit:4.13.2'
    // Robolectric : Context Android reel en test JVM (pour les tests qui construisent
    // PiloteDrone, dont le constructeur appelle ctx.getString). Compatible compileSdk 34.
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    // org.json REEL en test JVM. Android n'en fournit qu'un squelette dont toutes les
    // methodes rendent null : un test de serialisation JSON echouait donc par
    // NullPointerException sans que le code testé soit en cause. Portee TEST uniquement,
    // l'implementation d'Android reste seule utilisee sur l'appareil.
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.print:print:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.dji:dji-sdk-v5-aircraft:5.18.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // Media3 Transformer - montage video (assemblage automatique)
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    compileOnly 'com.dji:dji-sdk-v5-aircraft-provided:5.18.0'
    runtimeOnly 'com.dji:dji-sdk-v5-networkImp:5.18.0'
}

// ============================================================================
//  RAPPORT DE COUVERTURE JaCoCo — preuve chiffree pour le dossier de securite.
//  Lancer :  .\gradlew jacocoSoccerReport
//  Rapport HTML : app/build/reports/jacoco/jacocoSoccerReport/html/index.html
//  Rapport XML  : app/build/reports/jacoco/jacocoSoccerReport/jacocoSoccerReport.xml
//  Cible : le package pur ca.cineflight.stage.sport.soccer (composants testables).
// ============================================================================
tasks.register('jacocoSoccerReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Rapport de couverture JaCoCo du package soccer (dossier securite).'
    // Toujours regenerer (sinon Gradle peut considerer la tache "up-to-date" et
    // ne pas ecrire le rapport HTML/XML).
    outputs.upToDateWhen { false }

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }

    // Classes compilees a mesurer : uniquement le package soccer (composants purs).
    def kotlinClasses = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug",
        includes: ['ca/cineflight/stage/sport/soccer/**'])
    def javaClasses = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes",
        includes: ['ca/cineflight/stage/sport/soccer/**'])
    classDirectories.setFrom(files(kotlinClasses, javaClasses))

    // Sources correspondantes (pour l'affichage annote dans le rapport HTML).
    sourceDirectories.setFrom(files(['src/main/java']))

    // Donnees d'execution produites par les tests unitaires debug.
    executionData.setFrom(fileTree(dir: buildDir,
        includes: ['jacoco/testDebugUnitTest.exec', 'outputs/unit_test_code_coverage/**/*.ec', 'outputs/unit_test_code_coverage/**/*.exec']))
}

//  PERIMETRE SECURITE COMPLET (v54, audit V53-D03) : couverture soccer + control.
//  Le package control contient des elements critiques de la chaine (mapping Virtual
//  Stick, surveillance RC, SafetyLimits, snapshot, adaptateurs). Rapport separe pour
//  pouvoir citer les deux perimetres dans le dossier.
//  Lancer :  .\gradlew jacocoSecurityReport
//  Rapport : app/build/reports/jacoco/jacocoSecurityReport/html/index.html (+ .xml)
tasks.register('jacocoSecurityReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Rapport JaCoCo du perimetre securite complet : sport.soccer + control.'
    outputs.upToDateWhen { false }

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }

    def kotlinClassesSec = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug",
        includes: ['ca/cineflight/stage/sport/soccer/**', 'ca/cineflight/stage/control/**'])
    def javaClassesSec = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes",
        includes: ['ca/cineflight/stage/sport/soccer/**', 'ca/cineflight/stage/control/**'])
    classDirectories.setFrom(files(kotlinClassesSec, javaClassesSec))

    sourceDirectories.setFrom(files(['src/main/java']))

    executionData.setFrom(fileTree(dir: buildDir,
        includes: ['jacoco/testDebugUnitTest.exec', 'outputs/unit_test_code_coverage/**/*.ec', 'outputs/unit_test_code_coverage/**/*.exec']))
}
