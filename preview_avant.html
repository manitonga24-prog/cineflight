<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --border: #2a323d;
    --text: #e6e9ee;
    --text-dim: #8b95a3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; }

  .hud {
    position: absolute;
    top: 14px; left: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    max-width: 340px;
    z-index: 5;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  .hud h1 {
    font-size: 13px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    margin-bottom: 3px;
  }
  .hud .sub {
    font-size: 11px; color: var(--text-dim); margin-bottom: 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 3px 0;
  }
  .swatch { width: 16px; height: 4px; border-radius: 2px; flex-shrink: 0; }
  .swatch.dash {
    height: 0; border-top: 3px dashed currentColor; background: none;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    flex-shrink: 0; border: 1.5px solid rgba(255,255,255,.7);
  }
  .legend-sep { height: 1px; background: var(--border); margin: 9px 0; }
  .stat { font-size: 11px; color: var(--text-dim); line-height: 1.85; }
  .stat b { color: var(--text); font-weight: 600; }
  .stat .route-name { display: inline-block; min-width: 8px; }

  .wp-popup {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.6;
    color: #EAEef3;
  }
  .wp-popup .wp-title {
    font-weight: 700; font-size: 12px; margin-bottom: 4px;
    color: #FFFFFF;
  }
  .wp-popup .wp-role {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 1px 5px; border-radius: 3px; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: .03em;
    color: #0e1116;
  }
  .wp-popup .wp-adj { color: #FF6B6B; font-weight: 700; margin-top: 3px; }
  /* la bulle Mapbox : fond sombre, texte clair, bien contrastés */
  .mapboxgl-popup-content {
    border-radius: 6px; padding: 10px 13px;
    background: #1A2230;
    border: 1px solid #3A4456;
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
  }
  /* la pointe de la bulle, adaptée au fond sombre */
  .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #1A2230; }
  .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #1A2230; }
  .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #1A2230; }
  .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #1A2230; }
  .mapboxgl-popup-anchor-top-left .mapboxgl-popup-tip,
  .mapboxgl-popup-anchor-top-right .mapboxgl-popup-tip { border-bottom-color: #1A2230; }
  .mapboxgl-popup-anchor-bottom-left .mapboxgl-popup-tip,
  .mapboxgl-popup-anchor-bottom-right .mapboxgl-popup-tip { border-top-color: #1A2230; }
  /* bouton de fermeture lisible sur fond sombre */
  .mapboxgl-popup-close-button { color: #AAB2C0; font-size: 16px; }
  .mapboxgl-popup-close-button:hover {
    background: transparent; color: #FFFFFF;
  }
</style>
</head>

djusted": false, "role": "mid"}, {"index": 74, "milestone": false, "lat": 45.50856633345425, "lon": -73.55381424216917, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 75.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 75, "milestone": false, "lat": 45.5086478, "lon": -73.55382954646379, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 90.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 76, "milestone": false, "lat": 45.50872926654575, "lon": -73.55381424216917, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 105.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 77, "milestone": false, "lat": 45.50880518128103, "lon": -73.55376937224766, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 120.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 78, "milestone": false, "lat": 45.5088703707421, "lon": -73.55369799451029, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 135.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 79, "milestone": false, "lat": 45.50892039237491, "lon": -73.5536049732319, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 150.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 80, "milestone": false, "lat": 45.50895183728785, "lon": -73.55349664765886, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 165.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 81, "milestone": false, "lat": 45.50896256256207, "lon": -73.5533804, "alt": 45.0, "speed": 2.5, "gimbal_yaw": 180.0, "gimbal_pitch": -30.0, "action": "gimbal_point", "adjusted": false, "role": "mid"}, {"index": 82, "milestone": false, "lat": 45.5017, "lon": -73.5673, "alt": 60.0, "speed": 8.0, "gimbal_yaw": 0.0, "gimbal_pitch": -45.0, "action": "fly_to", "adjusted": false, "role": "mid"}, {"index": 83, "milestone": true, "lat": 45.5017, "lon": -73.5673, "alt": 2.0, "speed": 2.0, "gimbal_yaw": 0.0, "gimbal_pitch": 0.0, "action": "fly_to", "adjusted": false, "role": "end"}], "length_m": 3994, "duration_s": 1345}], "center": [-73.56192289642857, 45.50480746626286], "adjustedColour": "#FF4D4D", "startColour": "#34C759", "endColour": "#FF453A", "targetColour": "#FFFFFF", "target": {"lat": 45.5017, "lon": -73.5673, "label": "Lieu"}};
mapboxgl.accessToken = "VOTRE_TOKEN_MAPBOX_ICI";

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/dark-v11",
  center: DATA.center,
  zoom: 16,
  pitch: 0.0,
});
map.addControl(new mapboxgl.NavigationControl(), "bottom-right");
map.addControl(new mapboxgl.ScaleControl({ unit: "metric" }), "bottom-left");

function actionLabel(a) {
  const m = {
    fly_to: "Vol vers le point",
    hover: "Vol stationnaire",
    gimbal_point: "Visee camera",
    thermal_scan: "Balayage thermique",
    zoom_inspect: "Inspection zoom",
    return_to_home: "Retour au point de depart",
  };
  return m[a] || a || "";
}

function fmtDuration(s) {
  if (s < 60) return s + " s";
  const m = Math.floor(s / 60), r = s % 60;
  return m + " min " + (r < 10 ? "0" : "") + r + " s";
}

// construit une icone de waypoint
//   - repere (depart, fin, debut de prise) : grand marqueur numerote
//   - waypoint courant : petit point sur la trajectoire
// Tous restent survolables pour afficher le detail.
function makeWpMarker(p, layer) {
  const el = document.createElement("div");
  el.style.borderRadius = "50%";
  el.style.cursor = "pointer";
  el.style.boxSizing = "border-box";

  // couleur de fond selon le role
  let bg = layer.colour;
  let ring = "rgba(255,255,255,.85)";
  if (p.role === "start") { bg = DATA.startColour; ring = "#fff"; }
  else if (p.role === "end") { bg = DATA.endColour; ring = "#fff"; }
  if (p.adjusted) { bg = DATA.adjustedColour; }

  if (!p.milestone) {
    // --- waypoint courant : petit point discret ---
    el.style.width = "7px";
    el.style.height = "7px";
    el.style.background = bg;
    el.style.border = "1px solid rgba(255,255,255,.55)";
    el.style.opacity = "0.85";
    return el;
  }

  // --- repere : grand marqueur numerote ---
  const isEnd = (p.role === "start" || p.role === "end");
  const size = isEnd ? 26 : 21;
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.display = "flex";
  el.style.alignItems = "center";
  el.style.justifyContent = "center";
  el.style.fontSize = (isEnd ? 11 : 10) + "px";
  el.style.fontWeight = "700";
  el.style.boxShadow = "0 1px 4px rgba(0,0,0,.5)";
  el.style.zIndex = isEnd ? "20" : "10";
  el.textContent = p.index;

  let fg = "#0e1116";
  if (p.role === "start" || p.role === "end") { fg = "#ffffff"; }
  el.style.color = fg;
  el.style.background = bg;
  el.style.border = (isEnd ? 3 : 2) + "px solid " + ring;
  return el;
}

map.on("load", () => {
  const bounds = new mapboxgl.LngLatBounds();
  let legendHtml = "";
  let statsHtml = "";

  DATA.layers.forEach((layer, li) => {
    const coords = layer.points.map(p => [p.lon, p.lat]);
    coords.forEach(c => bounds.extend(c));

    // --- trace de la trajectoire ---
    const lineId = "line-" + li;
    map.addSource(lineId, {
      type: "geojson",
      data: { type: "Feature",
              geometry: { type: "LineString", coordinates: coords } },
    });
    map.addLayer({
      id: lineId, type: "line", source: lineId,
      paint: {
        "line-color": layer.colour,
        "line-width": 2.5,
        "line-opacity": 0.9,
        "line-dasharray": (layer.kind === "recon" || layer.kind === "link") ? [2, 1.5] : [1],
      },
    });

    // --- fleches de direction le long de la trajectoire ---
    const arrowFeatures = [];
    for (let i = 1; i < layer.points.length; i++) {
      const a = layer.points[i - 1], b = layer.points[i];
      const ang = Math.atan2(b.lon - a.lon, b.lat - a.lat) * 180 / Math.PI;
      arrowFeatures.push({
        type: "Feature",
        geometry: { type: "Point",
                    coordinates: [(a.lon + b.lon) / 2, (a.lat + b.lat) / 2] },
        properties: { bearing: ang },
      });
    }
    const arrowId = "arrows-" + li;
    map.addSource(arrowId, {
      type: "geojson",
      data: { type: "FeatureCollection", features: arrowFeatures },
    });
    map.addLayer({
      id: arrowId, type: "symbol", source: arrowId,
      layout: {
        "text-field": "\u25B2",
        "text-size": 11,
        "text-rotate": ["get", "bearing"],
        "text-rotation-alignment": "map",
        "text-allow-overlap": true,
      },
      paint: { "text-color": layer.colour, "text-opacity": 0.85 },
    });

    // --- waypoints ---
    layer.points.forEach(p => {
      const el = makeWpMarker(p, layer);
      let roleTag = "";
      if (p.role === "start") {
        roleTag = '<span class="wp-role" style="background:' +
          DATA.startColour + ';color:#04210d">Depart</span><br>';
      } else if (p.role === "end") {
        roleTag = '<span class="wp-role" style="background:' +
          DATA.endColour + ';color:#2a0604">Arrivee</span><br>';
      }
      let adjLine = "";
      if (p.adjusted) {
        adjLine = '<div class="wp-adj">Altitude remontee par l analyse '
                + 'd obstacles</div>';
      }
      const popupHtml =
        '<div class="wp-popup">' +
        '<div class="wp-title">' + layer.name + ' - waypoint ' + p.index +
        '</div>' + roleTag +
        '<div>Altitude : ' + p.alt + ' m AGL</div>' +
        '<div>Vitesse : ' + p.speed + ' m/s</div>' +
        '<div>Camera : cap ' + p.gimbal_yaw + ' deg, ' +
        'inclinaison ' + p.gimbal_pitch + ' deg</div>' +
        '<div>' + actionLabel(p.action) + '</div>' +
        adjLine + '</div>';

      new mapboxgl.Marker({ element: el })
        .setLngLat([p.lon, p.lat])
        .setPopup(new mapboxgl.Popup({ offset: 14 }).setHTML(popupHtml))
        .addTo(map);
    });

    // --- legende ---
    const dashClass = layer.kind === "recon" ? " dash" : "";
    legendHtml +=
      '<div class="legend-item">' +
      '<span class="swatch' + dashClass + '" style="color:' + layer.colour +
      ';background:' + (layer.kind === "recon" ? "none" : layer.colour) +
      '"></span>' +
      '<span>' + layer.name + ' (' + layer.points.length + ' wp)</span>' +
      '</div>';

    // --- stats ---
    let altMin = Infinity, altMax = -Infinity, adjCount = 0;
    layer.points.forEach(p => {
      altMin = Math.min(altMin, p.alt);
      altMax = Math.max(altMax, p.alt);
      if (p.adjusted) adjCount++;
    });
    const altTxt = (altMin === altMax) ? (altMin + " m")
                   : (altMin + "-" + altMax + " m");
    statsHtml +=
      '<div><b>' + layer.name + '</b><br>' +
      '&nbsp;&nbsp;parcours ' + layer.length_m + ' m' +
      ' &middot; ~' + fmtDuration(layer.duration_s) + '<br>' +
      '&nbsp;&nbsp;altitude ' + altTxt + ' AGL' +
      (adjCount > 0 ? ' &middot; ' + adjCount + ' remonte(s)' : '') +
      '</div>';
  });

  // --- marqueur de cible ---
  if (DATA.target) {
    const t = document.createElement("div");
    t.style.width = "16px";
    t.style.height = "16px";
    t.style.borderRadius = "50%";
    t.style.background = "transparent";
    t.style.border = "2px solid " + DATA.targetColour;
    t.style.boxShadow = "0 0 0 1px rgba(0,0,0,.6), 0 0 10px rgba(255,255,255,.4)";
    const dotIn = document.createElement("div");
    dotIn.style.width = "4px";
    dotIn.style.height = "4px";
    dotIn.style.borderRadius = "50%";
    dotIn.style.background = DATA.targetColour;
    dotIn.style.margin = "4px auto";
    t.appendChild(dotIn);
    new mapboxgl.Marker({ element: t })
      .setLngLat([DATA.target.lon, DATA.target.lat])
      .setPopup(new mapboxgl.Popup({ offset: 12 }).setHTML(
        '<div class="wp-popup"><div class="wp-title">' +
        DATA.target.label + '</div><div>Centre de la zone</div></div>'))
      .addTo(map);
    bounds.extend([DATA.target.lon, DATA.target.lat]);
  }

  // --- legende : reperes depart / arrivee / remonte / cible ---
  legendHtml += '<div class="legend-sep"></div>';
  legendHtml +=
    '<div class="legend-item"><span class="dot" style="background:' +
    DATA.startColour + '"></span><span>Point de depart</span></div>';
  legendHtml +=
    '<div class="legend-item"><span class="dot" style="background:' +
    DATA.endColour + '"></span><span>Point d arrivee</span></div>';
  const anyAdjusted = DATA.layers.some(l =>
    l.points.some(p => p.adjusted));
  if (anyAdjusted) {
    legendHtml +=
      '<div class="legend-item"><span class="dot" style="background:' +
      DATA.adjustedColour + '"></span>' +
      '<span>Waypoint remonte (obstacle)</span></div>';
  }
  if (DATA.target) {
    legendHtml +=
      '<div class="legend-item"><span class="dot" style="background:' +
      'transparent;border-color:' + DATA.targetColour +
      '"></span><span>Cible</span></div>';
  }

  document.getElementById("legend").innerHTML = legendHtml;
  document.getElementById("stats").innerHTML = statsHtml;

  if (!bounds.isEmpty()) {
    map.fitBounds(bounds, { padding: 90, pitch: 0.0, maxZoom: 18 });
  }
});
</script>
